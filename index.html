<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfcfa">
  <title>碎念</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>碎念</h1>
    <p class="count" id="count"></p>
  </header>

  <main id="stage" class="stage">
    <div id="pages" class="pages"></div>
    <div class="pager">
      <button id="prev-btn" class="pager-btn" aria-label="更新一页">‹</button>
      <span id="pager-info" class="pager-info"></span>
      <button id="next-btn" class="pager-btn" aria-label="更早一页">›</button>
    </div>
  </main>

  <button id="fab" class="fab" aria-label="写一条">＋</button>

  <div id="editor" class="editor hidden">
    <div class="editor-head">
      <input type="date" id="editor-date" class="editor-date">
      <button id="editor-close" class="editor-close" aria-label="取消">取消</button>
    </div>
    <div class="editor-body">
      <textarea id="editor-text" class="editor-text" placeholder="写点想法，想写几段写几段…"></textarea>
      <div class="todo-block">
        <div class="todo-title">待办</div>
        <div id="todo-list" class="todo-list"></div>
        <div class="todo-add">
          <input id="todo-input" class="todo-input" placeholder="加一条待办…">
          <button id="todo-add-btn" class="todo-add-btn">加</button>
        </div>
      </div>
    </div>
    <div class="editor-foot">
      <button id="editor-delete" class="editor-delete hidden">删除</button>
      <button id="editor-save" class="editor-save">保存</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
